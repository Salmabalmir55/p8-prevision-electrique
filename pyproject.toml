[project]
name = "prevision-consommation-electrique"
version = "0.1.0"
description = "P8 - Séries temporelles et déploiement multi-environnements (DevOps/MLOps)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B019"]  # lru_cache sur méthode : instance unique et durable dans l'API

