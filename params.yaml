# Paramètres du pipeline. Chaque étape DVC ne dépend que des clés qu'elle lit.

data:
  # Consommation électrique journalière de l'Allemagne (Open Power System Data / ENTSO-E),
  # agrégée par jour dans le dépôt jenfly/opsd (licence MIT).
  url: https://raw.githubusercontent.com/jenfly/opsd/master/opsd_germany_daily.csv
  sha256: 729b025d984497827cb6b89048d7c2c6a551e7aa727bc47ea0b74a2d1e84675d
  # Bornes physiquement plausibles ; une valeur hors bornes est traitée comme manquante.
  min_gwh: 500
  max_gwh: 2000

split:
  # Découpage chronologique : tout ce qui précède cette date sert à l'apprentissage.
  test_start: "2017-01-01"

models:
  naive:
    season: 7
  ridge:
    lags: [1, 7, 14]
    alpha: 1.0
    fourier_order: 3
  arima:
    order: [2, 0, 1]
    fourier_order: 3
  prophet:
    changepoint_prior_scale: 0.05
    yearly_fourier_order: 10
  lstm:
    window: 28
    hidden_size: 32
    epochs: 40
    learning_rate: 0.005
    batch_size: 64
    seed: 42